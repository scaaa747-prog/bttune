name: Build & Release BTTUNE (Android APK & Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_tag: ${{ steps.version_step.outputs.VERSION_TAG }}
      version_name: ${{ steps.version_step.outputs.VERSION_NAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create Consistent Release Keystore
        run: |
          keytool -genkey -v \
            -keystore app/bttune.keystore \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bttuneapppass \
            -keypass bttuneapppass \
            -dname "CN=BTTUNE, OU=Music, O=BTTUNE, L=City, ST=State, C=IN"

      - name: Build Release APK
        env:
          MUSIC_DEBUG_SIGNING_STORE_PASSWORD: "bttuneapppass"
          MUSIC_DEBUG_KEYSTORE_FILE: "bttune.keystore"
          MUSIC_DEBUG_SIGNING_KEY_PASSWORD: "bttuneapppass"
        run: ./gradlew assembleRelease --build-cache --parallel --no-daemon

      - name: Prepare Single Clean Release APK
        id: version_step
        run: |
          mkdir -p release-output
          
          # Single lightweight ARM64 APK (8.2MB)
          if ls app/build/outputs/apk/release/*arm64-v8a*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*arm64-v8a*.apk release-output/BTTUNE-release.apk
          else
            cp app/build/outputs/apk/release/*.apk release-output/BTTUNE-release.apk
          fi
          
          ls -lh release-output/
          
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "VERSION_TAG=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Clean Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BTTUNE-release-apk
          path: release-output/BTTUNE-release.apk

  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    needs: build-android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Ultra-Lightweight Native Windows EXE (~3-5MB)
        working-directory: ./desktop
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ../windows-output

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTTUNE-Windows-EXE
          path: |
            windows-output/BTTUNE.exe
            windows-output/index.html
            windows-output/Microsoft.Web.WebView2.Core.dll
            windows-output/Microsoft.Web.WebView2.WinForms.dll
            windows-output/runtimes/win-x64/native/WebView2Loader.dll

  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build-android, build-windows-exe]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BTTUNE-release-apk
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: BTTUNE-Windows-EXE
          path: windows-pkg

      - name: Package Lightweight Windows Standalone
        run: |
          cd windows-pkg
          # Create single direct ZIP for Windows (approx 3-5MB)
          zip -r ../release-assets/BTTUNE-Windows-x64.zip ./*
          cp BTTUNE.exe ../release-assets/BTTUNE.exe || true
          cd ..
          ls -lh release-assets/

      - name: Publish All to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.version_tag }}
          name: "BTTUNE ${{ needs.build-android.outputs.version_name }}"
          body: |
            ### 🎵 BTTUNE - Modern Music Streaming (Android & Windows)
            
            - **Android APK**: Ultra-lightweight ~8.2 MB (`BTTUNE-release.apk`)
            - **Windows Native**: Ultra-lightweight ~3.5 MB (`BTTUNE.exe` / `BTTUNE-Windows-x64.zip`) with Medium Quality Smart Audio Cache
            - **Seamless Experience**: Same Liquid Glass UI and instant playback
          draft: false
          prerelease: false
          files: |
            release-assets/BTTUNE-release.apk
            release-assets/BTTUNE.exe
            release-assets/BTTUNE-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
