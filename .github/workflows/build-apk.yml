name: Build & Release BTTUNE (Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Ultra-Lightweight Native Windows EXE (~3-5MB)
        working-directory: ./desktop
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ../windows-output

      - name: Extract Version
        id: version_step
        shell: pwsh
        run: |
          $version = Select-String -Path app/build.gradle.kts -Pattern 'versionName = "(.*)"' | ForEach-Object { $_.Matches.Groups[1].Value }
          echo "VERSION_TAG=v$version" >> $env:GITHUB_OUTPUT
          echo "VERSION_NAME=$version" >> $env:GITHUB_OUTPUT

      - name: Package Windows ZIP & EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          Compress-Archive -Path windows-output/* -DestinationPath release-assets/BTTUNE-Windows-x64.zip -Force
          Copy-Item windows-output/BTTUNE.exe -Destination release-assets/BTTUNE.exe -Force
          Get-ChildItem release-assets

      - name: Publish All to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.version_step.outputs.VERSION_TAG }}
          name: "BTTUNE ${{ steps.version_step.outputs.VERSION_NAME }}"
          body: |
            ### 🎵 BTTUNE - Modern Music Streaming for Windows
            
            - **Direct Windows Native EXE**: Ultra-lightweight ~3.5 MB (`BTTUNE.exe`)
            - **Complete Portable Package**: `BTTUNE-Windows-x64.zip`
            - **Smart Medium-Quality Audio Cache**: 128-160kbps balanced audio caching
            - **Liquid Glass UI**: Modern dark theme with seamless controls
          draft: false
          prerelease: false
          files: |
            release-assets/BTTUNE.exe
            release-assets/BTTUNE-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
