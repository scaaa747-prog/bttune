name: Build & Release BTTUNE (Windows EXE)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Ultra-Lightweight Native Windows EXE (~3-5MB)
        working-directory: ./desktop
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ../windows-output

      - name: Extract Version
        id: version_step
        shell: bash
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "VERSION_TAG=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Package & Publish to GitHub Releases
        shell: bash
        run: |
          mkdir -p release-assets
          cd windows-output
          zip -r ../release-assets/BTTUNE-Windows-x64.zip ./*
          cp BTTUNE.exe ../release-assets/BTTUNE.exe || true
          cd ..
          ls -lh release-assets/

      - name: Publish All to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.version_step.outputs.VERSION_TAG }}
          name: "BTTUNE ${{ steps.version_step.outputs.VERSION_NAME }}"
          body: |
            ### 🎵 BTTUNE - Modern Music Streaming for Windows
            
            - **Windows Native EXE**: Ultra-lightweight ~3.5 MB (`BTTUNE.exe` / `BTTUNE-Windows-x64.zip`)
            - **Smart Medium-Quality Audio Cache**: 128-160kbps balanced audio caching for low data & fast playback
            - **Liquid Glass UI**: Modern dark theme with seamless controls
          draft: false
          prerelease: false
          files: |
            release-assets/BTTUNE.exe
            release-assets/BTTUNE-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
