<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTTUNE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #9C27B0;
      --primary-light: #BA68C8;
      --accent: #E040FB;
      --bg-dark: #0A0A0E;
      --card-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-glow: rgba(156, 39, 176, 0.15);
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1c0f2a, #0A0A0E 70%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      height: 100%;
      background: rgba(13, 13, 17, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 28px 12px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #9C27B0, #E040FB);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(156, 39, 176, 0.4);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand-title span { color: var(--accent); }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #FFF;
      transform: translateX(4px);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(156, 39, 176, 0.25), rgba(224, 64, 251, 0.15));
      color: #FFF;
      border: 1px solid rgba(224, 64, 251, 0.3);
      box-shadow: 0 4px 15px var(--glass-glow);
    }

    /* Main Content Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Top Search Bar */
    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(10, 10, 14, 0.5);
      backdrop-filter: blur(15px);
    }

    .search-box {
      width: 420px;
      height: 44px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .search-box:focus-within {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(224, 64, 251, 0.25);
    }

    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFF;
      font-size: 14px;
      width: 100%;
    }

    .search-input::placeholder {
      color: var(--text-sub);
    }

    /* Content Scroll Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      padding-bottom: 120px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Music Grid */
    .music-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 36px;
    }

    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 0 0 18px var(--glass-glow);
      border-color: rgba(224, 64, 251, 0.4);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 12px;
      background: #181822;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-artist {
      font-size: 12px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Player Bar (Bottom Glass Floating) */
    .player-bar {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      height: 80px;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(156, 39, 176, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .player-track {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 280px;
    }

    .player-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      background: #252535;
    }

    .track-info .track-name {
      font-size: 14px;
      font-weight: 600;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-info .track-sub {
      font-size: 12px;
      color: var(--text-sub);
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 560px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-ctrl {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      opacity: 0.8;
    }

    .btn-ctrl:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn-play {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9C27B0, #E040FB);
      color: #FFF;
      opacity: 1;
      box-shadow: 0 4px 14px rgba(156, 39, 176, 0.5);
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-size: 11px;
      color: var(--text-sub);
      width: 35px;
    }

    .progress-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9C27B0, #E040FB);
      border-radius: 2px;
      position: relative;
    }

    .cache-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(0, 230, 118, 0.15);
      color: #00E676;
      border: 1px solid rgba(0, 230, 118, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <div class="brand-title">BT<span>TUNE</span></div>
    </div>

    <ul class="nav-list">
      <li class="nav-item active" onclick="switchTab('home')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </li>
      <li class="nav-item" onclick="switchTab('explore')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
        Quick Picks
      </li>
      <li class="nav-item" onclick="switchTab('library')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H8V8h4V4h2v4h4v4z"/></svg>
        Downloaded & Cache
      </li>
      <li class="nav-item" onclick="switchTab('settings')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Settings
      </li>
    </ul>
  </aside>

  <!-- Main View -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search songs, artists, albums…" onkeydown="if(event.key==='Enter') searchMusic()">
      </div>
      <div class="cache-badge" id="cacheIndicator">
        ⚡ Medium Quality Offline Cache (128-160kbps Balanced)
      </div>
    </header>

    <main class="content-area" id="contentArea">
      <h2 class="section-title">Trending & Quick Picks</h2>
      <div class="music-grid" id="musicGrid">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Player Bar -->
    <div class="player-bar" id="playerBar">
      <div class="player-track">
        <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=120&auto=format&fit=crop&q=60" id="playerThumb" class="player-thumb">
        <div class="track-info">
          <div class="track-name" id="playerTitle">Select a track</div>
          <div class="track-sub" id="playerArtist">BTTUNE Streaming</div>
        </div>
      </div>

      <div class="player-controls">
        <div class="control-buttons">
          <button class="btn-ctrl" onclick="prevTrack()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="btn-ctrl btn-play" id="btnPlay" onclick="togglePlay()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="btn-ctrl" onclick="nextTrack()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>

        <div class="progress-bar-container">
          <span class="time-label" id="currentTime">0:00</span>
          <div class="progress-track" id="progressTrack" onclick="seekTrack(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time-label" id="durationTime">0:00</span>
        </div>
      </div>

      <div style="width: 140px; display: flex; justify-content: flex-end; align-items: center; gap: 8px;">
        <span class="cache-badge" id="cachedSongTag" style="display: none;">Saved in Cache</span>
      </div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const { ipcRenderer } = require('electron');
    const audio = document.getElementById('audioPlayer');

    const sampleSongs = [
      { id: '1', title: 'Starboy', artist: 'The Weeknd, Daft Punk', thumb: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
      { id: '2', title: 'Blinding Lights', artist: 'The Weeknd', thumb: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop&q=80', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
      { id: '3', title: 'Levitating', artist: 'Dua Lipa', thumb: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&auto=format&fit=crop&q=80', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
      { id: '4', title: 'Save Your Tears', artist: 'The Weeknd', thumb: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300&auto=format&fit=crop&q=80', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' }
    ];

    let currentSongIndex = 0;

    function renderGrid(songs) {
      const grid = document.getElementById('musicGrid');
      grid.innerHTML = songs.map((s, idx) => `
        <div class="song-card" onclick="playSongAtIndex(${idx})">
          <img src="${s.thumb}" class="card-thumb" loading="lazy">
          <div class="card-title">${s.title}</div>
          <div class="card-artist">${s.artist}</div>
        </div>
      `).join('');
    }

    // IndexedDB for universal high-performance persistent cache
    const DB_NAME = 'BTTUNE_Music_Cache';
    let db;
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore('audioCache', { keyPath: 'id' });
    };
    req.onsuccess = (e) => { db = e.target.result; };

    async function getCachedAudio(id) {
      if (!db) return null;
      return new Promise((resolve) => {
        const tx = db.transaction('audioCache', 'readonly');
        const store = tx.objectStore('audioCache');
        const q = store.get(id);
        q.onsuccess = () => resolve(q.result ? q.result.blob : null);
        q.onerror = () => resolve(null);
      });
    }

    async function saveCachedAudio(id, blob) {
      if (!db) return;
      const tx = db.transaction('audioCache', 'readwrite');
      tx.objectStore('audioCache').put({ id, blob });
    }

    async function playSongAtIndex(index) {
      currentSongIndex = index;
      const song = sampleSongs[index];
      document.getElementById('playerTitle').textContent = song.title;
      document.getElementById('playerArtist').textContent = song.artist;
      document.getElementById('playerThumb').src = song.thumb;

      // Smart Cache Check (IndexedDB)
      const cachedBlob = await getCachedAudio(song.id);
      if (cachedBlob) {
        audio.src = URL.createObjectURL(cachedBlob);
        document.getElementById('cachedSongTag').style.display = 'inline-flex';
      } else {
        audio.src = song.url;
        document.getElementById('cachedSongTag').style.display = 'none';

        // Background auto-cache medium bitrate audio
        fetch(song.url).then(res => res.blob()).then(blob => {
          saveCachedAudio(song.id, blob);
        }).catch(err => console.log('Auto-cache error:', err));
      }

      audio.play();
      updatePlayButton(true);
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        updatePlayButton(true);
      } else {
        audio.pause();
        updatePlayButton(false);
      }
    }

    function updatePlayButton(isPlaying) {
      const playIcon = document.getElementById('playIcon');
      if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('durationTime').textContent = formatTime(audio.duration);
      }
    };

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function seekTrack(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audio.currentTime = (clickX / width) * audio.duration;
    }

    function prevTrack() {
      currentSongIndex = (currentSongIndex - 1 + sampleSongs.length) % sampleSongs.length;
      playSongAtIndex(currentSongIndex);
    }

    function nextTrack() {
      currentSongIndex = (currentSongIndex + 1) % sampleSongs.length;
      playSongAtIndex(currentSongIndex);
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }

    renderGrid(sampleSongs);
  </script>
</body>
</html>
